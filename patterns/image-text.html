<style>
.demo-image-text { background:var(--d-ref-white); color:var(--d-ref-black); color-scheme:light; font:14px/1.4 Inter, Helvetica, Arial, sans-serif; padding:10px; container-type:inline-size; }
.demo-image-text .it-grid { display:grid; gap:10px; }
@container (min-width:440px) {
  .demo-image-text .it-grid { grid-template-columns:repeat(3, minmax(0, 1fr)); }
}
.demo-image-text .it-tile { position:relative; aspect-ratio:16 / 9; overflow:hidden; container-type:inline-size; background:var(--d-ref-stone); }
.demo-image-text[data-fmt="4x5"] .it-tile { aspect-ratio:4 / 5; }
.demo-image-text[data-fmt="og"] .it-tile { aspect-ratio:1200 / 630; }
.demo-image-text .it-img { position:absolute; inset:0; width:100%; height:100%; display:block; }
.demo-image-text .it-scrim { position:absolute; inset:0; background:linear-gradient(to top, var(--d-scrim) 0%, var(--d-scrim) 40%, transparent 70%); opacity:var(--d-alpha); }
.demo-image-text .it-text { position:absolute; left:5%; right:5%; bottom:8.889%; display:grid; gap:1cqw; color:var(--d-text); }
.demo-image-text[data-fmt="4x5"] .it-text { left:5.926%; right:5.926%; bottom:4.741%; }
.demo-image-text[data-fmt="og"] .it-text { left:5.333%; right:5.333%; bottom:10.159%; }
.demo-image-text .it-text b { font-size:7.6cqw; line-height:1.12; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.demo-image-text .it-text span { font-size:4.8cqw; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.demo-image-text .it-btn { justify-self:start; margin:0 0 0 4px; font-size:3.6cqw; line-height:1.3; padding:.6cqw 2cqw; color:var(--d-text); border:0; background:transparent;
  outline:2px solid var(--d-ref-white); outline-offset:0; box-shadow:0 0 0 4px var(--d-ref-black); }
.demo-image-text .it-tag { position:absolute; left:6px; top:6px; font:600 11px/1 Inter, Helvetica, Arial, sans-serif; letter-spacing:.06em; text-transform:uppercase;
  padding:4px 6px; background:var(--d-ref-white); color:var(--d-ref-black); }
.demo-image-text .it-safe { display:none; position:absolute; inset:8.889% 5%; border:1px dashed var(--d-text); outline:1px dashed var(--d-scrim); outline-offset:1px; pointer-events:none; }
.demo-image-text[data-fmt="4x5"] .it-safe { inset:4.741% 5.926%; }
.demo-image-text[data-fmt="og"] .it-safe { inset:10.159% 5.333%; }
.demo-image-text[data-safe="on"] .it-safe { display:block; }
.demo-image-text .it-note { margin:10px 2px 0; font-size:13px; }
.demo-image-text .it-safe-note { display:none; margin:4px 2px 0; font-size:13px; }
.demo-image-text[data-safe="on"] .it-safe-note { display:block; }
</style>
<div class="it-grid">
<div class="it-tile"><svg class="it-img" viewBox="0 0 160 90" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect width="160" height="90" style="fill:var(--d-ref-sky)"/><ellipse cx="44" cy="22" rx="30" ry="9" style="fill:var(--d-ref-white)"/><ellipse cx="118" cy="30" rx="34" ry="10" style="fill:var(--d-ref-white)"/><path d="M0 58 L40 50 L90 56 L160 48 L160 90 L0 90 Z" style="fill:var(--d-ref-sand)"/><rect x="0" y="66" width="160" height="24" style="fill:var(--d-ref-white)"/><rect x="132" y="40" width="3" height="28" style="fill:var(--d-ref-black)"/><path d="M124 40 L143 40 L133.5 33 Z" style="fill:var(--d-ref-black)"/><circle cx="20" cy="76" r="5" style="fill:var(--d-ref-light)"/></svg><div class="it-scrim"></div><span class="it-safe"></span><div class="it-text"><b>{{title}}</b><span>{{sub}}</span></div><span class="it-tag">{{light}}</span></div>
<div class="it-tile"><svg class="it-img" viewBox="0 0 160 90" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect width="160" height="90" style="fill:var(--d-ref-night)"/><path d="M0 52 L30 40 L64 50 L102 36 L160 46 L160 90 L0 90 Z" style="fill:var(--d-ref-dusk)"/><rect x="0" y="62" width="160" height="28" style="fill:var(--d-ref-black)"/><circle cx="118" cy="20" r="9" style="fill:var(--d-ref-white)"/><rect x="26" y="70" width="12" height="20" style="fill:var(--d-ref-white)"/><rect x="58" y="66" width="8" height="8" style="fill:var(--d-ref-light)"/><rect x="96" y="72" width="10" height="18" style="fill:var(--d-ref-stone)"/></svg><div class="it-scrim"></div><span class="it-safe"></span><div class="it-text"><b>{{title}}</b><span>{{sub}}</span></div><span class="it-tag">{{dark}}</span></div>
<div class="it-tile"><svg class="it-img" viewBox="0 0 160 90" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect width="160" height="90" style="fill:var(--d-ref-white)"/><path d="M0 0 L20 0 L0 20 Z M40 0 L60 0 L0 60 L0 40 Z M80 0 L100 0 L10 90 L0 90 L0 80 Z M120 0 L140 0 L50 90 L30 90 Z M160 0 L160 20 L90 90 L70 90 Z M160 40 L160 60 L130 90 L110 90 Z M160 80 L160 90 L150 90 Z" style="fill:var(--d-ref-black)"/><rect x="62" y="12" width="26" height="22" style="fill:var(--d-ref-red)"/><circle cx="128" cy="62" r="12" style="fill:var(--d-ref-blue)"/><rect x="14" y="46" width="22" height="14" style="fill:var(--d-ref-leaf)"/><rect x="96" y="20" width="18" height="12" style="fill:var(--d-ref-sand)"/></svg><div class="it-scrim"></div><span class="it-safe"></span><div class="it-text"><b>{{title}}</b><span class="it-btn">{{btn}}</span></div><span class="it-tag">{{busy}}</span></div>
</div>
<p class="it-note">{{note}}</p>
<p class="it-safe-note">{{safe}}</p>
